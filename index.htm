<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交情境挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: #f0f4f8;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Breathing helper animation */
        .breath-ring {
            width: 12px;
            height: 12px;
            background-color: #38b2ac;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: breathe 4s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.8); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 text-gray-800">

    <div class="bg-white max-w-xl w-full rounded-[2.5rem] shadow-xl border border-gray-100 p-8 sm:p-12 flex flex-col relative overflow-hidden">
        
        <!-- Decoration -->
        <div class="absolute top-0 right-0 -mt-8 -mr-8 w-32 h-32 bg-teal-50 rounded-full opacity-50"></div>
        
        <!-- Header -->
        <div class="text-center mb-10 relative z-10">
            <div class="flex justify-center items-center mb-3">
                <div class="breath-ring"></div>
                <span class="text-teal-700 text-xs font-bold uppercase tracking-widest">Speech Therapy Tool</span>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900 mb-3">社交情境練習</h1>
            <p class="text-gray-500 text-sm max-w-xs mx-auto">
                抽取一個情境，先深呼吸，想一想如何有條理、慢慢地表達。
            </p>
        </div>

        <!-- Main Display Card -->
        <div id="scenario-card" class="bg-teal-50/30 rounded-[2rem] p-8 min-h-[260px] flex flex-col justify-center mb-10 border-2 border-dashed border-teal-100 transition-all duration-300">
            
            <!-- Placeholder -->
            <div id="placeholder" class="text-center">
                <div class="bg-white w-16 h-16 rounded-2xl shadow-sm flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </div>
                <p class="text-teal-600/60 font-medium">準備好了嗎？點擊下方開始</p>
            </div>

            <!-- Scenario Content -->
            <div id="content" class="hidden">
                <div class="mb-4">
                    <span id="scenario-tag" class="bg-teal-600 text-white text-[10px] px-2 py-0.5 rounded-md font-bold uppercase tracking-wider mb-2 inline-block">情境中...</span>
                    <h2 id="scenario-title" class="text-2xl font-bold text-gray-800 tracking-tight"></h2>
                </div>
                <div class="h-px bg-teal-100 w-12 mb-4"></div>
                <p id="scenario-desc" class="text-gray-600 leading-relaxed text-lg text-justify"></p>
            </div>
            
        </div>

        <!-- Controls -->
        <div class="space-y-4">
            <button id="generate-btn" class="w-full bg-gray-900 hover:bg-gray-800 active:scale-[0.98] text-white font-bold py-4 px-8 rounded-2xl transition-all duration-200 shadow-lg flex justify-center items-center gap-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span id="btn-text">隨機抽取情境</span>
            </button>
            
            <p class="text-center text-[11px] text-gray-400 font-medium">練習重點：輕觸發音、適當停頓、保持眼神接觸</p>
        </div>
        
    </div>

    <script>
        const scenarios = [
            { title: "上課時不適", description: "你在上課時突然感到身體不舒服，覺得自己可能發燒，於是舉手告訴老師。" },
            { title: "活動時間衝突", description: "老師安排你擔任閱讀節攤位遊戲的小幫手，需要在班主任課時參加簡介會。但由於同一時間你要參加牧童笛隊練習，需要向老師解釋。" },
            { title: "STEAM嘉年華", description: "當日你擔任小幫手，有一位二年級同學告訴你他忘記帶水壺，覺得很口渴，你會如何處理？" },
            { title: "大家樂吃午飯", description: "你點了焗豬扒飯，發現飯裡有一條頭髮。你會跟店員或經理說什麼？" },
            { title: "治療課衝突", description: "商姑娘安排你在牧童笛比賽當天上言語治療課，你發現時間衝突，想向姑娘解釋。" },
            { title: "中學開放日", description: "有一位中學生問你就讀哪一所小學並詢問你一些問題，你會如何回答？" },
            { title: "小組討論中的異議", description: "在小組討論時，你發現組員打算放進報告的資料是錯誤的。你需要禮貌地打斷他們的討論，指出錯誤的地方，並提出正確的建議。" },
            { title: "文具店退換貨品", description: "你在文具店買了一支原子筆，走出店門後發現筆芯斷了無法書寫。你需要回店內向店員解釋情況，並詢問是否可以更換。" },
            { title: "邀請同學參加聚會", description: "你下星期生日，想邀請一位平時較少聊天、但同班的同學參加生日會。你需要詢問這位同學是否有空出席。" },
            { title: "忘記帶功課的解釋", description: "收功課時，你發現自己把最重要的數學作業留在了家裡的書桌上。你想主動走到教員室找數學老師解釋原因。" }
        ];

        let lastIndex = -1;
        const generateBtn = document.getElementById('generate-btn');
        const btnText = document.getElementById('btn-text');
        const placeholder = document.getElementById('placeholder');
        const content = document.getElementById('content');
        const titleEl = document.getElementById('scenario-title');
        const descEl = document.getElementById('scenario-desc');
        const card = document.getElementById('scenario-card');

        generateBtn.addEventListener('click', () => {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * scenarios.length);
            } while (newIndex === lastIndex);

            lastIndex = newIndex;
            const selected = scenarios[newIndex];

            // UI Changes
            card.classList.remove('border-dashed', 'border-teal-100');
            card.classList.add('border-solid', 'border-teal-200', 'bg-white', 'shadow-inner');
            placeholder.classList.add('hidden');
            content.classList.remove('hidden');

            // Animation reset
            content.classList.remove('fade-in');
            void content.offsetWidth; 
            content.classList.add('fade-in');

            titleEl.textContent = selected.title;
            descEl.textContent = selected.description;
            btnText.textContent = "抽取下一個挑戰";
        });
    </script>
</body>
</html>
